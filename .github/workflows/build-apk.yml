name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install unzip tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y unzip rsync

      - name: Extract corrected project
        run: |
          unzip -q text-to-video-ai-corrected.zip -d extracted
          ROOT=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)
          rsync -a "$ROOT"/ ./ --exclude ".git" --exclude ".github"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest --no-audit --no-fund

      - name: Verify Expo config
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -f app.config.ts
          test -f eas.json
          npx expo config --json > expo-config.json
          echo "Expo config OK"

      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --no-wait
        
