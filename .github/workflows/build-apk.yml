name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract ZIP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y unzip rsync
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          ROOT=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)
          rsync -a "$ROOT"/ ./ --exclude ".git" --exclude ".github"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install EAS
        run: npm install -g eas-cli --no-audit --no-fund

      - name: Link Expo project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas project:init --non-interactive --force

      - name: Build APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive
        
