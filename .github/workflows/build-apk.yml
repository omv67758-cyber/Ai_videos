name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f \( -name "text-to-video-ai-final.zip" -o -name "text-to-video-ai-final.zip.zip" \) | head -1)
          test -n "$ZIP"
          mkdir extracted
          unzip -q "$ZIP" -d extracted

          if [ -f extracted/app.config.ts ]; then
            cp -r extracted/. .
          else
            ROOT=$(find extracted -name app.config.ts -printf '%h\n' | head -1)
            cp -r "$ROOT"/. .
          fi

      - name: Verify Expo files
        run: |
          test -f app.config.ts
          test -f package.json
          test -d app
          echo "Expo project detected successfully"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Setup EAS
        run: npm install --global eas-cli

      - name: Build APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --no-wait
        
