name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP safely
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f \( \
            -name "text-to-video-ai-final.zip" \
            -o -name "text-to-video-ai-final.zip.zip" \
          \) | head -1)

          test -n "$ZIP"
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP" -d extracted

          ROOT="extracted"
          if [ ! -f "$ROOT/app.config.ts" ]; then
            ROOT=$(find extracted -type f -name app.config.ts -printf '%h\n' | head -1)
          fi

          test -f "$ROOT/app.config.ts"
          test -f "$ROOT/package.json"

          rsync -a \
            --exclude='.manus/' \
            --exclude='.git/' \
            --exclude='.expo/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            "$ROOT"/ ./

          echo "Expo project extracted successfully"

      - name: Verify Expo files
        run: |
          test -f app.config.ts
          test -f package.json
          test -d app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install EAS
        run: npm install --global eas-cli

      - name: Build APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --no-wait
        
